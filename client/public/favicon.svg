<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .outer { stroke: #1e293b; }
    .red { stroke: #a83e3a; }
    .teal { stroke: #2d5e6b; }
    @media (prefers-color-scheme: dark) {
      .outer { stroke: #e2e8f0; }
    }
  </style>
  <g fill="none" stroke-width="2" stroke-linecap="round">
    <circle class="outer" cx="16" cy="16" r="12"/>
    <ellipse class="red" cx="16" cy="16" rx="4" ry="10" transform="rotate(30 16 16)"/>
    <ellipse class="teal" cx="16" cy="16" rx="4" ry="10" transform="rotate(-30 16 16)"/>
  </g>
</svg>
